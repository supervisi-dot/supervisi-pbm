<head>

<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7fb,#101522);--surface:light-dark(#fff,#182131);--surface2:light-dark(#f0f3f8,#202b3d);--text:light-dark(#182235,#edf2f8);--muted:light-dark(#667085,#aeb9ca);--line:light-dark(#dfe5ee,#334155);--accent:light-dark(#315efb,#6d8cff);--good:#16845b;--warn:#b7791f;--danger:#c24141}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;padding:6px 10px 24px}.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:white;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.nav button{width:100%;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;margin:2px 0;font-size:14px}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text)}.nav .section{font-size:11px;color:var(--muted);padding:18px 12px 5px;text-transform:uppercase;letter-spacing:.08em}.main{padding:28px 34px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:var(--accent);font-weight:700;font-size:13px}.title{font-size:29px;font-weight:800;margin:4px 0}.subtitle{color:var(--muted);font-size:14px}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;background:var(--surface)}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}.stat{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}.panel h3{margin:0 0 14px;font-size:16px}.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:13px 0}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:600}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.small{padding:7px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px}.input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted);background:var(--surface2);font-weight:700}tr:last-child td{border-bottom:0}.badge{font-size:11px;border-radius:999px;padding:5px 8px;font-weight:700}.badge.good{background:#e3f5ed;color:var(--good)}.badge.warn{background:#fff4db;color:var(--warn)}.score{font-weight:800}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sectionTitle{margin:22px 0 10px;font-weight:800}.indicators{display:grid;gap:10px}.indicator{border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface)}.indicatorTop{display:flex;gap:10px;justify-content:space-between}.code{font-weight:800;color:var(--accent);min-width:32px}.indicatorText{flex:1;font-size:13px;line-height:1.45}.scoreBtns{display:flex;gap:5px}.scoreBtns button{width:34px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer}.scoreBtns button.sel{background:var(--accent);border-color:var(--accent);color:white}.ai{background:linear-gradient(135deg,#eef2ff,#f7f9ff);color:#17213b;border:1px solid #dbe3ff}.ai strong{color:#315efb}.ai textarea{background:white;color:#17213b;border-color:#cfd8f2}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:15px;max-width:680px;width:100%;padding:22px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:12px 15px;border-radius:10px;display:none;box-shadow:0 10px 30px #0003}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav .section{display:none}.nav button{white-space:nowrap}.main{padding:20px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.cards,.formgrid,.filters{grid-template-columns:1fr}.top{flex-direction:column}.title{font-size:24px}}
</style></head>

const teachers=[
 {nip:'198601012010011001',name:'Ahmad Fauzi, S.Pd.',mapel:'Bahasa Indonesia',kelas:'VII / 1',status:'Sudah'},

 {nip:'198903202015031003',name:'Budi Santoso, S.Pd.',mapel:'IPA',kelas:'IX / 1',status:'Belum'},
 {nip:'197912122005011004',name:'Dewi Lestari, S.Pd.',mapel:'Bahasa Inggris',kelas:'VIII / 1',status:'Sudah'},
 {nip:'198506182009021005',name:'Andi Pratama, S.Pd.',mapel:'PJOK',kelas:'VII / 1',status:'Belum'},

const perangkat=[
['P1','Capaian & Tujuan Pembelajaran','Capaian Pembelajaran tersedia dan sesuai dengan mata pelajaran'],['P2','Capaian & Tujuan Pembelajaran','Tujuan Pembelajaran dirumuskan secara jelas dan terukur'],['P3','Capaian & Tujuan Pembelajaran','Tujuan pembelajaran sesuai dengan karakteristik peserta didik'],['P4','Capaian & Tujuan Pembelajaran','Tujuan pembelajaran mengembangkan kemampuan berpikir tingkat tinggi'],['P5','Capaian & Tujuan Pembelajaran','Terdapat keterkaitan antara CP, TP, dan kegiatan pembelajaran'],['P6','Modul Ajar/RPP','Modul ajar/RPP tersedia dan sistematis'],['P7','Modul Ajar/RPP','Identitas pembelajaran lengkap'],['P8','Modul Ajar/RPP','Tujuan pembelajaran tercantum dengan jelas'],['P9','Modul Ajar/RPP','Langkah pembelajaran tersusun logis dari awal sampai akhir'],['P10','Modul Ajar/RPP','Kegiatan pembelajaran berpusat pada peserta didik'],['P11','Modul Ajar/RPP','Kegiatan mendorong keaktifan, kolaborasi, komunikasi, dan berpikir kritis'],['P12','Modul Ajar/RPP','Terdapat kegiatan literasi'],['P13','Modul Ajar/RPP','Terdapat kegiatan numerasi yang relevan dengan materi'],['P14','Modul Ajar/RPP','Terdapat diferensiasi sesuai kebutuhan peserta didik'],['P15','Modul Ajar/RPP','Kegiatan memperhatikan karakter dan konteks lingkungan peserta didik'],['P16','Materi & Sumber Belajar','Materi pembelajaran sesuai dengan tujuan pembelajaran'],['P17','Materi & Sumber Belajar','Materi disusun dari sederhana menuju kompleks'],['P18','Materi & Sumber Belajar','Sumber belajar beragam dan relevan'],['P19','Materi & Sumber Belajar','Sumber belajar mendukung pengembangan literasi dan numerasi'],['P20','Media & Teknologi','Media pembelajaran tersedia dan sesuai tujuan'],['P21','Media & Teknologi','Media membantu peserta didik memahami materi'],['P22','Media & Teknologi','Pemanfaatan teknologi sesuai kebutuhan pembelajaran'],['P23','Media & Teknologi','Media memperhatikan karakteristik peserta didik'],['P24','Asesmen Pembelajaran','Terdapat asesmen diagnostik/awal sesua const observasi=[['O1','Keteraturan & Suasana','Lingkungan pembelajaran siap, tertata, aman, nyaman, dan mendukung peserta didik untuk belajar.'],['O2','Keteraturan & Suasana','Media pembelajaran yang diperlukan tersedia, siap digunakan, dan sesuai dengan tujuan pembelajaran.'],['O3','Keteraturan & Suasana','Sumber belajar yang diperlukan tersedia, relevan, dan dapat diakses peserta didik.'],['O4','Keteraturan & Suasana','Peserta didik siap belajar secara fisik, mental, dan sosial.'],['O5','Keteraturan & Suasana','Kesepakatan/kebiasaan kelas diterapkan dan mendukung proses pembelajaran.'],['O6','Keteraturan & Suasana','Guru menciptakan suasana aman, nyaman, inklusif, dan menghargai peserta didik.'],['O7','Keteraturan & Suasana','Sebagian besar peserta didik terlibat aktif dalam proses pembelajaran.'],['O8','Keteraturan & Suasana','Guru menerapkan disiplin positif dan pendekatan edukatif.'],['O9','Pembelajaran Mendalam','Guru membantu peserta didik memahami tujuan dan manfaat pembelajaran.'],['O10','Pembelajaran Mendalam','Pembelajaran dikaitkan dengan pengalaman, lingkungan, atau kehidupan nyata peserta didik.'],['O11','Pembelajaran Mendalam','Aktivitas membangun rasa ingin tahu, antusiasme, dan pengalaman belajar positif.'],['O12','Pembelajaran Mendalam','Guru mendorong pemahaman konsep, bukan sekadar hafalan.'],['O13','Pembelajaran Mendalam','Pertanyaan/tugas mendorong analisis, alasan, bukti, atau pemecahan masalah.'],['O14','Pembelajaran Mendalam','Peserta didik diberi kesempatan mengidentifikasi dan menyelesaikan masalah.'],['O15','Pembelajaran Mendalam','Peserta didik bekerja sama, berdiskusi, berbagi ide, dan membangun pemahaman.'],['O16','Pembelajaran Mendalam','Peserta didik diberi kesempatan menghasilkan ide, solusi, produk, atau karya.'],['O17','Pembelajaran Mendalam','Peserta didik merefleksikan proses dan hasil belajar.'],['O18','Penguatan Literasi','Peserta didik membaca dan memahami informasi dari teks/sumber yang relevan.'],['O19','Penguatan Literasi','Peserta didik menemukan informasi penting, gagasan utama, atau hubungan antarinformasi.'],['O20','Penguatan Literasi','Peserta didik membandingkan, menilai, atau memverifikasi informasi berdasarkan bukti.'],['O21','Penguatan Literasi','Peserta didik menggunakan berbagai sumber informasi secara tepat.'],['O22','Penguatan Literasi','Peserta didik mengomunikasikan pemikiran melalui tulisan/laporan/argumentasi.'],['O23','Penguatan Literasi','Peserta didik menyampaikan ide, alasan, hasil analisis, atau kesimpulan secara lisan.'],['O24','Penguatan Numerasi','Peserta didik membaca atau menafsirkan tabel, grafik, diagram, atau data.'],['O25','Penguatan Numerasi','Peserta didik menggunakan bilangan/perhitungan yang relevan dalam menyelesaikan masalah.'],['O26','Penguatan Numerasi','Peserta didik menggunakan alasan, pola, hubungan, atau konsep matematika untuk mengambil kesimpulan.'],['O27','Penguatan Numerasi','Konsep numerasi diterapkan dalam situasi kehidupan nyata atau konteks mata pelajaran.'],['O28','Penguatan Numerasi','Peserta didik menjelaskan makna hasil perhitungan/data dan menggunakannya untuk mengambil keputusan.'],['O29','Asesmen & Umpan Balik','Guru melakukan pengecekan pemahaman selama proses pembelajaran.'],['O30','Asesmen & Umpan Balik','Guru menggunakan pertanyaan untuk mengetahui pemahaman dan mendorong berpikir.'],['O31','Asesmen & Umpan Balik','Guru memberikan umpan balik spesifik yang membantu perbaikan belajar.'],['O32','Asesmen & Umpan Balik','Guru memberikan bantuan/tantangan sesuai kebutuhan belajar peserta didik.'],['O33','Asesmen & Umpan Balik','Hasil asesmen digunakan untuk menentukan perbaikan, pengayaan, atau pembelajaran berikutnya.']];
let scores={}; let currentTeacher=teachers[0];
const nav=[['dashboard','Dashboard'],['guru','Data Guru'],['perangkat','Supervisi Perangkat'],['pembelajaran','Observasi Pembelajaran'],['laporan','Laporan & Analisis']];
function app(){document.getElementById('app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><div class="logo">SP</div><div><b>Supervisi PBM</b><small>Prototype Web + AI</small></div></div><div class="nav"><div class="section">Menu utama</div>${nav.map(([id,l],i)=>`<button class="navbtn ${i?'':'active'}" onclick="go('${id}')">${l}</button>`).join('')}<div class="section">Pengaturan</div><button class="navbtn" onclick="go('pengaturan')">Profil Sekolah</button><button class="navbtn" onclick="showAI()">✨ Bantuan AI</button></div></aside><main class="main" id="main"></main></div>`; go('dashboard')}
function go(page){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().includes(page==='dashboard'?'dashboard':page==='guru'?'data guru':page==='perangkat'?'supervisi perangkat':page==='pembelajaran'?'observasi pembelajaran':page==='laporan'?'laporan':'profil'))); ({dashboard:dashboard,guru:guru,perangkat:perangkatPage,pembelajaran:pembelajaranPage,laporan:laporan,pengaturan:pengaturan}[page]||dashboard)()}
function dashboard(){let done=teachers.filter(t=>t.status==='Sudah').length; document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">APLIKASI SUPERVISI GURU</div><div class="title">Dashboard Supervisi PBM</div><div class="subtitle">Analisis perencanaan, implementasi, dan refleksi pembelajaran.</div></div><span class="pill"><i class="dot"></i> Mode prototype aktif</span></div><div class="cards"><div class="card"><div class="muted">Jumlah Guru</div><div class="stat">${teachers.length}</div><div class="muted">data terdaftar</div></div><div class="card"><div class="muted">Sudah Disupervisi</div><div class="stat">${done}</div><div class="muted">${Math.round(done/teachers.length*100)}% dari guru</div></div><div class="card"><div class="muted">Belum Disupervisi</div><div class="stat">${teachers.length-done}</div><div class="muted">perlu dijadwalkan</div></div><div class="card"><div class="muted">Rata-rata Nilai</div><div class="stat">86</div><div class="muted">gabungan simulasi</div></div></div><div class="grid2"><div class="panel"><h3>Progress Supervisi</h3><div class="row"><span>Perangkat Pembelajaran</span><b>82%</b></div><div class="bar"><i style="width:82%"></i></div><div class="row"><span>Observasi Pembelajaran</span><b>74%</b></div><div class="bar"><i style="width:74%"></i></div><div class="row"><span>Refleksi & Tindak Lanjut</span><b>61%</b></div><div class="bar"><i style="width:61%"></i></div></div><div class="panel"><h3>Aksi Cepat</h3><div class="actions"><button class="btn primary" onclick="go('perangkat')">+ Mulai Supervisi</button><button class="btn" onclick="go('guru')">Kelola Guru</button><button class="btn" onclick="go('laporan')">Lihat Rekap</button></div><div class="ai" style="margin-top:15px;padding:15px"><strong>✨ AI Assistant</strong><p style="font-size:13px;margin:7px 0 12px">Masukkan catatan observasi, AI prototype akan menyusun temuan dan rekomendasi tindak lanjut.</p><button class="btn small" onclick="showAI()">Coba AI</button></div></div></div>`}
function guru(){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">MASTER DATA</div><div class="title">Data Guru</div><div class="subtitle">Pengganti sheet DATA GURU. NIP menjadi kunci untuk pengisian otomatis.</div></div><button class="btn primary" onclick="addGuru()">+ Tambah Guru</button></div><div class="panel"><div class="toolbar"><input class="input" id="search" placeholder="Cari nama, NIP, atau mata pelajaran…" oninput="renderGuru()"><span class="pill">${teachers.length} guru</span></div><div class="tablewrap"><table><thead><tr><th>No</th><th>NIP</th><th>Nama Guru</th><th>Mata Pelajaran</th><th>Kelas/Semester</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="guruBody"></tbody></table></div></div>`;renderGuru()}
function renderGuru(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=teachers.filter(t=>Object.values(t).join(' ').toLowerCase().includes(q));document.getElementById('guruBody').innerHTML=arr.map((t,i)=>`<tr><td>${i+1}</td><td>${t.nip}</td><td><b>${t.name}</b></td><td>${t.mapel}</td><td>${t.kelas}</td><td><span class="badge ${t.status==='Sudah'?'good':'warn'}">${t.status}</span></td><td><button class="btn small" onclick="startFor('${t.nip}')">Supervisi</button></td></tr>`).join('')}
function startFor(nip){currentTeacher=teachers.find(t=>t.nip===nip)||teachers[0];go('perangkat')}
function perangkatPage(){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">ENTRI PERANGKAT</div><div class="title">Supervisi Perangkat Pembelajaran</div><div class="subtitle">Skor 1–4. Nama dan mata pelajaran otomatis mengikuti NIP.</div></div><span class="pill">Guru: <b>${currentTeacher.name}</b></span></div><div class="panel"><div class="formgrid"><label>Guru<select onchange="currentTeacher=teachers.find(t=>t.nip===this.value);perangkatPage()">${teachers.map(t=>`<option value="${t.nip}" ${t.nip===currentTeacher.nip?'selected':''}>${t.name} — ${t.nip}</option>`).join('')}</select></label><label>Tanggal Supervisi<input class="input" type="date" value="2026-09-30"></label></div><div class="sectionTitle">Indikator & Penilaian</div><div class="indicators">${perangkat.map(x=>indicator(x,'p')).join('')}</div><div class="row" style="margin-top:18px"><div><b>Nilai sementara: <span id="totalP">-</span></b><div class="muted" style="font-size:12px">Kategori dihitung otomatis</div></div><div class="actions"><button class="btn" onclick="aiFromScores('perangkat')">✨ Analisis dengan AI</button><button class="btn primary" onclick="saveSupervisi('perangkat')">Simpan Supervisi</button></div></div></div>`;updateTotal('p',perangkat.length)}
function indicator(x,prefix){let [code,group,text]=x;let val=scores[prefix+code]||0;return `<div class="indicator"><div class="indicatorTop"><div style="display:flex;gap:9px"><div class="code">${code}</div><div class="indicatorText"><b>${group}</b><br>${text}</div></div><div class="scoreBtns">${[1,2,3,4].map(n=>`<button class="${val===n?'sel':''}" onclick="setScore('${prefix+code}',${n},'${prefix}')">${n}</button>`).join('')}</div></div></div>`}
function setScore(k,n,prefix){scores[k]=n;let page=prefix==='p'?perangkatPage:pembelajaranPage;page()}
function updateTotal(prefix,len){let vals=Object.keys(scores).filter(k=>k.startsWith(prefix)).map(k=>scores[k]);let total=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*25):0;let el=document.getElementById(prefix==='p'?'totalP':'totalO');if(el)el.textContent=vals.length?total+' / 100':'-'}
function pembelajaranPage(){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">OBSERVASI PEMBELAJARAN</div><div class="title">Entri Hasil Observasi</div><div class="subtitle">Catat bukti observasi lalu gunakan AI untuk menyusun ringkasan dan tindak lanjut.</div></div><span class="pill">Guru: <b>${currentTeacher.name}</b></span></div><div class="panel"><div class="formgrid"><label>Guru<select onchange="currentTeacher=teachers.find(t=>t.nip===this.value);pembelajaranPage()">${teachers.map(t=>`<option value="${t.nip}" ${t.nip===currentTeacher.nip?'selected':''}>${t.name}</option>`).join('')}</select></label><label>Tanggal<input class="input" type="date" value="2026-09-30"></label></div><div class="sectionTitle">Indikator Observasi</div><div class="indicators">${observasi.map(x=>indicator(x,'o')).join('')}</div><div class="row" style="margin-top:18px"><div><b>Nilai sementara: <span id="totalO">-</span></b></div><div class="actions"><button class="btn" onclick="showAI()">✨ Bantu susun catatan</button><button class="btn primary" onclick="saveSupervisi('observasi')">Simpan Observasi</button></div></div></div>`;updateTotal('o',observasi.length)}
function laporan(){let rows=teachers.map((t,i)=>{let p=t.status==='Sudah'?84+i%4:null,o=t.status==='Sudah'?86-i%3:null;return `<tr><td>${i+1}</td><td>${t.name}</td><td>${t.mapel}</td><td>${p??'—'}</td><td>${o??'—'}</td><td>${p?Math.round((p+o)/2):'—'}</td><td><button class="btn small" onclick="report('${t.nip}')">Detail</button></td></tr>`}).join('');document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">ANALISIS GABUNGAN</div><div class="title">Laporan & Analisis</div><div class="subtitle">Rekap per guru, komponen penilaian, dan tindak lanjut.</div></div><div class="actions"><button class="btn" onclick="toast('Prototype: ekspor PDF siap diintegrasikan')">PDF</button><button class="btn" onclick="toast('Prototype: ekspor Excel siap diintegrasikan')">Excel</button></div></div><div class="cards"><div class="card"><div class="muted">Rata-rata Perangkat</div><div class="stat">84</div></div><div class="card"><div class="muted">Rata-rata Pembelajaran</div><div class="stat">86</div></div><div class="card"><div class="muted">Perlu Tindak Lanjut</div><div class="stat">2</div></div><div class="card"><div class="muted">Kelengkapan Data</div><div class="stat">78%</div></div></div><div class="panel" style="margin-top:16px"><div class="toolbar"><h3 style="margin:0">Rekap Per Guru</h3><input class="input" style="max-width:320px" placeholder="Cari guru…"></div><div class="tablewrap"><table><thead><tr><th>No</th><th>Nama Guru</th><th>Mapel</th><th>Perangkat</th><th>Pembelajaran</th><th>Gabungan</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function report(nip){let t=teachers.find(x=>x.nip===nip);document.getElementById('modalbox').innerHTML=`<div class="top"><div><div class="eyebrow">LAPORAN GURU</div><div class="title" style="font-size:23px">${t.name}</div><div class="subtitle">${t.mapel} · ${t.kelas}</div></div><button class="btn" onclick="closeModal()">Tutup</button></div><div class="cards"><div class="card"><div class="muted">Perangkat</div><div class="stat">86</div></div><div class="card"><div class="muted">Pembelajaran</div><div class="stat">88</div></div></div><div class="ai" style="padding:15px;margin-top:15px"><strong>✨ Ringkasan AI (simulasi)</strong><p>Perencanaan pembelajaran sudah cukup lengkap. Penguatan dapat diarahkan pada diferensiasi, pemanfaatan asesmen formatif, dan dokumentasi tindak lanjut.</p><b>Rekomendasi:</b><ul><li>Perjelas tujuan pembelajaran dan kriteria keberhasilan.</li><li>Gunakan hasil asesmen untuk menentukan pengayaan/remedial.</li><li>Dokumentasikan refleksi dan tindak lanjut secara berkala.</li></ul></div>`;openModal()}
function pengaturan(){document.getElementById('main').innerHTML=`<div class="top"><div><div class="eyebrow">PENGATURAN SEKOLAH</div><div class="title">Profil Sekolah</div><div class="subtitle">Pengganti sheet HOME.</div></div></div><div class="panel"><div class="formgrid"><label>Nama Sekolah<input class="input" value="SMP Contoh Negeri"></label><label>Semester / Tahun Ajaran<input class="input" value="Semester 1 / 2026-2027"></label><label>Alamat KOP Surat<input class="input" value="Jl. Pendidikan No. 1"></label><label>Kecamatan<input class="input" value="Ngawi"></label><label>Nama Kepala Sekolah<input class="input" value="Drs. Kepala Sekolah"></label><label>NIP Kepala Sekolah<input class="input" value=""></label></div><div style="margin-top:16px"><button class="btn primary" onclick="toast('Profil sekolah tersimpan pada prototype')">Simpan Pengaturan</button></div></div>`}
function addGuru(){document.getElementById('modalbox').innerHTML=`<h3>Tambah Guru</h3><div class="formgrid"><label>NIP<input class="input"></label><label>Nama Guru<input class="input"></label><label>Mata Pelajaran<input class="input"></label><label>Kelas/Semester<input class="input"></label></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="toast('Guru ditambahkan (simulasi)');closeModal()">Simpan</button></div>`;openModal()}
function showAI(){document.getElementById('modalbox').innerHTML=`<div class="top"><div><div class="eyebrow">AI ASSISTANT</div><div class="title" style="font-size:22px">Bantu Analisis Supervisi</div><div class="subtitle">Prototype lokal — belum terhubung ke model AI eksternal.</div></div><button class="btn" onclick="closeModal()">Tutup</button></div><label>Catatan / bukti observasi<textarea id="aiText" rows="6" placeholder="Contoh: Guru sudah menggunakan modul ajar dan media digital. Namun tujuan pembelajaran belum disampaikan di awal dan asesmen formatif belum terdokumentasi."></textarea></label><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="runAI()">✨ Analisis Otomatis</button></div><div id="aiResult" style="margin-top:14px"></div>`;openModal()}
function runAI(){let txt=document.getElementById('aiText').value||'Guru menggunakan modul ajar, tetapi tujuan pembelajaran belum disampaikan secara jelas dan tindak lanjut asesmen belum terdokumentasi.';let out=`<div class="ai" style="padding:15px"><strong>Hasil analisis AI (simulasi)</strong><p><b>Temuan:</b> ${txt}</p><p><b>Kategori:</b> Perencanaan & Asesmen Pembelajaran</p><p><b>Rekomendasi:</b> Perjelas tujuan pembelajaran pada awal kegiatan, gunakan asesmen formatif selama proses, dan dokumentasikan tindak lanjut berdasarkan hasil asesmen.</p><p><b>Tindak lanjut:</b> Pendampingan penyusunan tujuan/kriteria keberhasilan dan review bukti asesmen pada supervisi berikutnya.</p></div>`;document.getElementById('aiResult').innerHTML=out}
function aiFromScores(){showAI()}
function saveSupervisi(type){currentTeacher.status='Sudah';toast(type==='perangkat'?'Supervisi perangkat tersimpan':'Observasi pembelajaran tersimpan')}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}
app();
</script></body></html>
